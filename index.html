<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>NetWars</title>
		<style>
			html, body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: #000;
			}

			#game {
				position: fixed;
				inset: 0;
				cursor: none; /* the HUD stick marker shows the mouse position */
			}

			#game canvas {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				display: block;
			}

			#game canvas.hud {
				pointer-events: none;
			}

			#controls {
				position: fixed;
				top: 12px;
				right: 12px;
				display: flex;
				align-items: center;
				gap: 12px;
				color: rgba(110, 255, 140, 0.85);
				font: 12px ui-monospace, monospace;
			}
		</style>
	</head>
	<body>
		<div id="game"></div>
		<div id="controls">
			<label>Difficulty <select id="difficulty"></select></label>
			<button id="explode">EXPLODE THEM ALL</button>
		</div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
